name: Multi-platform Build with PyInstaller

on:
  push:
    branches:
      - 1.x.x

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.12.7']
      fail-fast: false  # 禁止失败快速终止
      max-parallel: 1   # 每次只运行一个平台
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UPX
        shell: bash
        run: |
          UPX_VERSION="5.0.1"
          case "$RUNNER_OS" in
            Windows)
              curl -L -o upx.zip "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-win64.zip"
              unzip upx.zip
              mkdir -p upx-win  # 创建目标目录
              mv upx-${UPX_VERSION}-win64/* upx-win/
              rm -rf upx-${UPX_VERSION}-win64
              echo "UPX_DIR=$(pwd)/upx-win" >> $GITHUB_ENV
              ;;
            Linux)
              curl -L -o upx.tar.xz "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
              tar -xf upx.tar.xz
              echo "$(pwd)/upx-${UPX_VERSION}-amd64_linux" >> $GITHUB_PATH
              ;;
            macOS)
              brew install upx || { echo "Failed to install UPX"; exit 1; }
              echo "$(brew --prefix)/opt/upx/bin" >> $GITHUB_PATH
              ;;
          esac

      - name: Verify UPX installation
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              "$UPX_DIR/upx.exe" --version
              ;;
            Linux|macOS)
              upx --version
              ;;
          esac

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tomlkit aiofiles aiohttp

      - name: Build executable
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              pyinstaller --onefile --upx-dir="upx-win" McFileFetcher.py || { echo "PyInstaller failed on Windows"; exit 1; }
              ;;
            Linux|macOS)
              pyinstaller --onefile McFileFetcher.py || { echo "PyInstaller failed on $RUNNER_OS"; exit 1; }
              ;;
          esac

      - name: Verify dist directory
        shell: bash
        run: |
          ls -la dist/
          if [ ! -d "dist" ]; then
            echo "dist directory not found!" && exit 1
          fi
          if [ -z "$(ls -A dist/)" ]; then
            echo "dist directory is empty!" && exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcfilefetcher-${{ runner.os }}
          path: dist/