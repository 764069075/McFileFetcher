name: Multi-platform Build with PyInstaller

on:
  push:
    branches:
      - 1.x.x

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.12.7']
      fail-fast: false  # 禁止失败快速终止
      max-parallel: 1   # 每次只运行一个平台
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # 验证文件是否被正确克隆
        run: |
          ls -la
          if [ ! -f "McFileFetcher.py" ]; then
            echo "McFileFetcher.py not found!" && exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tomlkit aiofiles aiohttp

      - name: Install UPX
        shell: bash
        run: |
          UPX_VERSION="5.0.1"
          case "$RUNNER_OS" in
            Windows)
              curl -L -o upx.zip "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-win64.zip"
              unzip upx.zip
              mkdir -p upx-win
              mv upx-${UPX_VERSION}-win64/* upx-win/
              echo "$(pwd)/upx-win" >> $GITHUB_PATH
              ;;
            Linux)
              curl -L -o upx.tar.xz "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
              tar -xf upx.tar.xz
              echo "$(pwd)/upx-${UPX_VERSION}-amd64_linux" >> $GITHUB_PATH
              ;;
            macOS)
              brew install xz || { echo "Failed to install xz"; exit 1; }
              curl -L -o upx-src.tar.xz "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-src.tar.xz"
              tar -xJf upx-src.tar.xz || { echo "Failed to extract upx-src.tar.xz"; exit 1; }
              # 使用解压后的实际目录名（注意 -src 后缀）
              cd upx-${UPX_VERSION}-src || { echo "Directory not found"; exit 1; }
              make -f Makefile.osx || { echo "UPX compilation failed"; exit 1; }
              echo "$(pwd)/src" >> $GITHUB_PATH
              ;;
          esac

      - name: Verify UPX installation
        run: |
          which upx
          upx --version

      - name: Build executable
        run: |
          case "$RUNNER_OS" in
            Windows)
              pyinstaller --onefile --upx-dir="upx-win" McFileFetcher.py || { echo "PyInstaller failed on Windows"; exit 1; }
              ;;
            Linux|macOS)
              pyinstaller --onefile McFileFetcher.py || { echo "PyInstaller failed on $RUNNER_OS"; exit 1; }
              ;;
          esac

      - name: Verify dist directory
        run: |
          ls -la dist/
          if [ ! -d "dist" ]; then
            echo "dist directory not found!" && exit 1
          fi
          if [ -z "$(ls -A dist/)" ]; then
            echo "dist directory is empty!" && exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcfilefetcher-${{ runner.os }}-binaries
          path: dist/